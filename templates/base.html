<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EcoPulse{% endblock %} — MAGO Solutions</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    :root {
      --eco: #0A7C5C; --eco-dark: #065C43; --eco-light: #E6F7F2;
      --mago: #1A56DB; --mago-light: #EBF2FF;
      --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB;
      --gray-300: #D1D5DB; --gray-400: #9CA3AF; --gray-500: #6B7280;
      --gray-600: #4B5563; --gray-700: #374151; --gray-800: #1F2937;
      --gray-900: #111827;
      --red: #DC2626; --red-light: #FEE2E2;
      --yellow: #D97706; --yellow-light: #FEF3C7;
      --green: #059669; --green-light: #D1FAE5;
      --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray-50); color: var(--gray-800); font-size: 14px; }
    a { text-decoration: none; color: inherit; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--gray-200); background: white; color: var(--gray-700); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
    .btn:hover { background: var(--gray-50); border-color: var(--gray-300); }
    .btn-primary { background: var(--eco); color: white; border-color: var(--eco); }
    .btn-primary:hover { background: var(--eco-dark); }
    .btn-danger { background: var(--red); color: white; border-color: var(--red); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .badge-green { background: var(--green-light); color: #065F46; }
    .badge-yellow { background: var(--yellow-light); color: #92400E; }
    .badge-red { background: var(--red-light); color: #991B1B; }
    .badge-blue { background: var(--mago-light); color: #1E40AF; }
    .badge-gray { background: var(--gray-100); color: var(--gray-600); }
    .led { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
    .led-verde { background: #10B981; box-shadow: 0 0 6px #10B981; }
    .led-amarillo { background: #F59E0B; box-shadow: 0 0 6px #F59E0B; }
    .led-rojo { background: #EF4444; box-shadow: 0 0 6px #EF4444; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow); }
    .card-title { font-size: 14px; font-weight: 600; color: var(--gray-700); margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 600; color: var(--gray-500); border-bottom: 1px solid var(--gray-200); text-transform: uppercase; letter-spacing: .05em; background: var(--gray-50); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--gray-100); color: var(--gray-700); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--gray-50); }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 12px; font-weight: 500; color: var(--gray-600); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--gray-300); border-radius: 8px; background: white; color: var(--gray-800); font-family: inherit; transition: border-color .15s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--eco); box-shadow: 0 0 0 3px rgba(10,124,92,.1); }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    .empty-state { text-align: center; padding: 3rem; color: var(--gray-400); }
    .empty-state i { font-size: 40px; margin-bottom: 8px; display: block; }
    .alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 1rem; }
    .alert-error { background: var(--red-light); color: #991B1B; border: 1px solid #FECACA; }
    .alert-success { background: var(--green-light); color: #065F46; border: 1px solid #A7F3D0; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 1rem; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; color: white; animation: slideIn .3s ease; }
    .toast-success { background: var(--green); }
    .toast-error { background: var(--red); }
    @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }

    /* LAYOUT */
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: var(--gray-900); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 50; }
    .sidebar-brand { padding: 1.25rem 1rem; border-bottom: 1px solid var(--gray-700); }
    .brand-logo { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 34px; height: 34px; background: var(--eco); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 16px; flex-shrink: 0; }
    .brand-name { font-size: 15px; font-weight: 700; color: white; }
    .brand-sub { font-size: 10px; color: var(--gray-400); margin-top: 1px; }
    .sidebar-nav { flex: 1; padding: 1rem 0; overflow-y: auto; }
    .nav-section { padding: 0 1rem; margin-bottom: 1.5rem; }
    .nav-label { font-size: 10px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
    .nav-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 7px; color: var(--gray-400); font-size: 13px; font-weight: 500; transition: all .15s; margin-bottom: 2px; cursor: pointer; }
    .nav-item:hover { background: var(--gray-800); color: white; }
    .nav-item.active { background: var(--eco); color: white; }
    .nav-item i { font-size: 17px; flex-shrink: 0; }
    .sidebar-footer { padding: 1rem; border-top: 1px solid var(--gray-700); }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--eco); display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .user-name { font-size: 12px; font-weight: 500; color: white; }
    .user-rol { font-size: 10px; color: var(--gray-400); }
    .main-content { margin-left: 220px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: white; border-bottom: 1px solid var(--gray-200); padding: 0 1.5rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; }
    .page-title { font-size: 16px; font-weight: 600; color: var(--gray-800); }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .page-content { padding: 1.5rem; flex: 1; }
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
    .metric-card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 1rem 1.25rem; }
    .metric-label { font-size: 12px; color: var(--gray-500); font-weight: 500; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
    .metric-value { font-size: 26px; font-weight: 700; color: var(--gray-800); line-height: 1; }
    .metric-sub { font-size: 11px; color: var(--gray-400); margin-top: 4px; }
    @media(max-width:768px) { .sidebar{transform:translateX(-100%)} .main-content{margin-left:0} }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<div class="toast-container" id="toastContainer"></div>
<script>
function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
async function api(url, method='GET', data=null) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (data) opts.body = JSON.stringify(data);
  const res = await fetch(url, opts);
  return res.json();
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
