<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoPulse — Iniciar sesión</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0A7C5C 0%,#065C43 50%,#111827 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
    .login-box{background:white;border-radius:16px;padding:2.5rem;width:100%;max-width:400px;box-shadow:0 25px 60px rgba(0,0,0,.3)}
    .login-brand{text-align:center;margin-bottom:2rem}
    .login-icon{width:56px;height:56px;background:#0A7C5C;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:28px;color:white}
    .login-title{font-size:22px;font-weight:700;color:#111827}
    .login-sub{font-size:13px;color:#6B7280;margin-top:4px}
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
    .input-wrap{position:relative}
    .input-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9CA3AF;font-size:16px}
    .input-wrap input{width:100%;padding:10px 12px 10px 38px;font-size:14px;border:1.5px solid #E5E7EB;border-radius:9px;background:white;color:#111827;font-family:inherit;transition:border-color .15s}
    .input-wrap input:focus{outline:none;border-color:#0A7C5C;box-shadow:0 0 0 3px rgba(10,124,92,.1)}
    .btn-login{width:100%;padding:11px;background:#0A7C5C;color:white;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:.5rem;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-login:hover{background:#065C43}
    .alert-error{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:1rem;display:flex;align-items:center;gap:6px}
    .login-footer{text-align:center;margin-top:1.5rem;font-size:11px;color:#9CA3AF}
    .login-footer span{color:#0A7C5C;font-weight:600}
  </style>
</head>
<body>
<div class="login-box">
  <div class="login-brand">
    <div class="login-icon"><i class="ti ti-bolt"></i></div>
    <div class="login-title">EcoPulse</div>
    <div class="login-sub">Sistema de gestión de máquinas</div>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert-error"><i class="ti ti-alert-circle"></i>{{ message }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="form-group">
      <label>Correo electrónico</label>
      <div class="input-wrap">
        <i class="ti ti-mail"></i>
        <input type="email" name="email" placeholder="correo@empresa.com" required autofocus>
      </div>
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <div class="input-wrap">
        <i class="ti ti-lock"></i>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
    </div>
    <button type="submit" class="btn-login"><i class="ti ti-login"></i>Ingresar al sistema</button>
  </form>
  <div class="login-footer">Desarrollado por <span>MAGO Solutions</span> · ECO © 2026</div>
</div>
</body>
</html>
